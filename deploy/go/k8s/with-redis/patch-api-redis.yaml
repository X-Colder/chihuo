apiVersion: apps/v1
kind: Deployment
metadata:
  name: chihuo-go-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_URL
              value: "redis://chihuo-go-redis:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chihuo-go-api-secret
                  key: REDIS_PASSWORD
