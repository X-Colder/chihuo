apiVersion: v1
kind: Service
metadata:
  name: chihuo-go-redis
  labels:
    app.kubernetes.io/name: chihuo-go-redis
    app.kubernetes.io/part-of: chihuo
spec:
  selector:
    app.kubernetes.io/name: chihuo-go-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chihuo-go-redis
  labels:
    app.kubernetes.io/name: chihuo-go-redis
    app.kubernetes.io/part-of: chihuo
spec:
  serviceName: chihuo-go-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chihuo-go-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chihuo-go-redis
        app.kubernetes.io/part-of: chihuo
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chihuo-go-api-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
