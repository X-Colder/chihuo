apiVersion: apps/v1
kind: Deployment
metadata:
  name: chihuo-go-api
  labels:
    app.kubernetes.io/name: chihuo-go-api
    app.kubernetes.io/part-of: chihuo
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chihuo-go-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chihuo-go-api
        app.kubernetes.io/part-of: chihuo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chihuo-go-api
      containers:
        - name: api
          image: chihuo-go-api:local
          imagePullPolicy: IfNotPresent
          # Apply the migration Job and wait for completion before rolling out
          # this Deployment. The binary currently keeps an idempotent startup
          # migration as a compatibility fallback until a migrate-only entrypoint
          # is introduced.
          command: ["/usr/local/bin/chihuo-api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: chihuo-go-api-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chihuo-go-api-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chihuo-go-api-secret
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir: {}
