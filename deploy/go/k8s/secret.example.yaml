apiVersion: v1
kind: Secret
metadata:
  name: chihuo-go-api-secret
  namespace: chihuo-go
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-secret
  DATABASE_URL: postgresql://chihuo:replace-with-local-password@chihuo-go-postgres:5432/chihuo
  WECHAT_APP_SECRET: replace-with-wechat-app-secret
  POSTGRES_PASSWORD: replace-with-local-password
  REDIS_PASSWORD: replace-with-redis-password
