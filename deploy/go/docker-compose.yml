services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chihuo-go-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-chihuo-go-api:local}
    build:
      context: ../..
      dockerfile: deploy/go/Dockerfile
      args:
        GO_API_DIR: ${GO_API_DIR:-backend-go}
        GO_VERSION: ${GO_VERSION:-1.24}
    environment:
      HTTP_ADDR: ":4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      JWT_ISSUER: ${JWT_ISSUER:-chihuo-api}
      JWT_TTL: ${JWT_TTL:-168h}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_CODE2SESSION_URL: ${WECHAT_CODE2SESSION_URL:-https://api.weixin.qq.com/sns/jscode2session}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-200}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-400}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4000/health/ready"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-chihuo-go-api:local}
    build:
      context: ../..
      dockerfile: deploy/go/Dockerfile
      args:
        GO_API_DIR: ${GO_API_DIR:-backend-go}
        GO_VERSION: ${GO_VERSION:-1.24}
    command: ["migrate"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    profiles: ["redis"]
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - chihuo-go-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  chihuo-go-postgres:
  chihuo-go-redis:
