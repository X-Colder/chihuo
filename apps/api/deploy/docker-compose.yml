services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chihuo
      POSTGRES_USER: chihuo
      POSTGRES_PASSWORD: chihuo
    ports:
      - "5432:5432"
    volumes:
      - chihuo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chihuo -d chihuo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      JWT_SECRET: compose-demo-secret-change-me
      DATABASE_URL: postgres://chihuo:chihuo@postgres:5432/chihuo
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  chihuo-postgres:
